# Render's free instance spins down after a few quiet minutes, and while it is down the
# edge answers robots.txt and page requests without reaching this app - which is how
# Google got "Blocked by robots.txt" on every indexing request. One GET every five
# minutes keeps the instance up; that stays inside the free 750 instance-hours a month.
name: Keep the free instance awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the service
        run: curl -sS --max-time 90 -o /dev/null -w "robots.txt %{http_code}\n" https://orbit-gs0d.onrender.com/robots.txt
